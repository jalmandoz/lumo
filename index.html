<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Unbounded:wght@800&display=swap">

  <style>
    /* ---------- tokens ---------- */
    :root{
      --blanco:#FFFFFF;
      --texto:#1A0710;
      --apagado:#6E5A63;
      --linea:rgba(11,0,5,.16);
      --linea-fuerte:rgba(11,0,5,.30);

      --rosa:#B21A52;
      --vino:#70012B;
      --vino-hondo:#25000E;
      --negro:#000000;

      /* la marca nunca cambia de tipo */
      --fuente-marca:'Unbounded', sans-serif;
      /* el titular: cambia esta linea para probar otra voz */
      --fuente-titular:'Instrument Serif', Georgia, serif;
      --fuente-texto:'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      --curva:cubic-bezier(.2,.7,.2,1);
    }

    /* ---------- base ---------- */
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      background:var(--blanco);
      color:var(--texto);
      font-family:var(--fuente-texto);
      font-size:16px;
      line-height:1.6;
      -webkit-font-smoothing:antialiased;
    }

    .contenedor{
      width:100%;
      max-width:780px;
      margin:0 auto;
      padding:0 32px;
    }
    @media (max-width:640px){
      .contenedor{padding:0 22px;}
    }

    /* ---------- entrada ---------- */
    .entrada{
      min-height:100svh;
      display:flex;
      align-items:center;
      padding:80px 0;
    }
    .bloque{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:10px;
    }

    /* ---------- titular ---------- */
    .saludo{
      font-family:var(--fuente-titular);
      font-weight:400;
      font-size:clamp(2.4rem,7vw,4.4rem);
      line-height:1.04;
      letter-spacing:-.015em;
      margin:0;
      color:var(--texto);
      text-wrap:balance;
    }

    /* la palabra lumo es la marca */
    .logo{
      font-family:var(--fuente-marca);
      font-weight:800;
      font-size:.78em;
      letter-spacing:-.045em;
      color:var(--vino);
      display:inline-block;
    }
    @supports (-webkit-background-clip:text) or (background-clip:text){
      .logo{
        /* la mitad izquierda de esta rampa es el logo tal cual quedo aprobado */
        background-image:linear-gradient(90deg,
          var(--rosa)        0%,
          var(--vino)       17%,
          var(--vino-hondo) 36%,
          var(--negro)      50%,
          var(--rosa)      100%);
        background-size:200% 100%;
        background-position:100% 0;
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
        animation:rasante 1.5s var(--curva) .35s forwards,
                  respirar 14s ease-in-out 1.9s infinite;
      }
    }
    @keyframes rasante{
      from{background-position:100% 0;}
      to  {background-position:0% 0;}
    }
    @keyframes respirar{
      0%,100%{background-position:0% 0;}
      50%    {background-position:9% 0;}
    }

    .pregunta{
      font-size:1.16rem;
      color:var(--apagado);
      margin:6px 0 20px;
    }

    /* ---------- fila de acciones ---------- */
    .acciones{
      display:flex;
      align-items:stretch;
      gap:14px;
      flex-wrap:wrap;
      width:100%;
    }

    /* boton con relleno que entra desde la izquierda */
    .boton{
      position:relative;
      isolation:isolate;
      overflow:hidden;
      font-family:var(--fuente-texto);
      font-size:1rem;
      font-weight:600;
      color:var(--blanco);
      background:var(--vino);
      border:1.5px solid var(--vino);
      height:62px;
      padding:0 30px;
      cursor:pointer;
      white-space:nowrap;
      transition:color .3s var(--curva), border-color .3s var(--curva);
    }
    .boton::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      background:var(--rosa);
      transform:scaleX(0);
      transform-origin:left center;
      transition:transform .42s var(--curva);
    }
    .boton:hover::before{transform:scaleX(1);}
    .boton:focus-visible{outline:2px solid var(--vino);outline-offset:3px;}

    .boton[aria-pressed="true"]{
      background:var(--blanco);
      color:var(--vino);
      border-color:var(--linea-fuerte);
    }
    .boton[aria-pressed="true"]:hover{
      color:var(--blanco);
      border-color:var(--rosa);
    }

    /* caja */
    .caja{
      position:relative;
      flex:1;
      min-width:290px;
      display:flex;
      align-items:center;
      height:62px;
      background:var(--blanco);
      border:1.5px solid var(--linea);
      transition:border-color .3s var(--curva);
    }
    .caja::after{
      content:"";
      position:absolute;
      left:0;right:0;bottom:-1.5px;
      height:2px;
      background:linear-gradient(90deg,var(--rosa),var(--vino-hondo));
      transform:scaleX(0);
      transform-origin:left center;
      transition:transform .42s var(--curva);
    }
    .caja:focus-within{border-color:var(--linea-fuerte);}
    .caja:focus-within::after{transform:scaleX(1);}

    .caja input{
      flex:1;
      min-width:0;
      height:100%;
      border:none;
      outline:none;
      background:transparent;
      padding:0 18px;
      font-family:var(--fuente-texto);
      font-size:1rem;
      color:var(--texto);
    }
    .caja input::placeholder{
      color:var(--apagado);
      transition:opacity .22s var(--curva);
    }
    .caja input:focus::placeholder{opacity:.45;}

    .enviar{
      height:100%;
      width:60px;
      flex:0 0 auto;
      border:none;
      background:transparent;
      color:var(--vino);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:background .3s var(--curva), color .3s var(--curva);
    }
    .enviar:hover{background:var(--vino);color:var(--blanco);}
    .enviar:focus-visible{outline:2px solid var(--vino);outline-offset:-4px;}
    .enviar svg{
      width:21px;height:21px;display:block;
      transition:transform .34s var(--curva);
    }
    .enviar:hover svg{transform:translateX(3px);}

    /* ---------- entrada escalonada ---------- */
    .sube{
      opacity:0;
      transform:translateY(16px);
      animation:subir .78s var(--curva) forwards;
    }
    .sube-1{animation-delay:.05s;}
    .sube-2{animation-delay:.20s;}
    .sube-3{animation-delay:.32s;}
    @keyframes subir{
      to{opacity:1;transform:translateY(0);}
    }

    @media (max-width:560px){
      .acciones{flex-direction:column;}
      .boton{width:100%;}
      .caja{width:100%;min-width:0;}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation:none !important;
        transition:none !important;
      }
      .sube{opacity:1;transform:none;}
      .logo{background-position:0% 0;}
    }
  </style>
</head>
<body>

  <main class="entrada">
    <div class="contenedor bloque">

      <h1 class="saludo sube sube-1">
        Bienvenid@ a <span class="logo">lumo</span>
      </h1>

      <p class="pregunta sube sube-2">¿Ya tienes página web?</p>

      <div class="acciones sube sube-3">

        <button class="boton" id="redes" type="button" aria-pressed="false">Pon tus redes si no tienes</button>

        <form class="caja" action="#" method="get">
          <label for="url" hidden>Dirección de tu página</label>
          <input id="url" name="url" type="url" inputmode="url" placeholder="pega aquí tu página" autocomplete="url">
          <button class="enviar" type="submit" aria-label="Calificar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true">
              <path d="M4 12h15"/>
              <path d="M13 6l6 6-6 6"/>
            </svg>
          </button>
        </form>

      </div>

    </div>
  </main>

  <script>
    // El boton alterna la caja entre pagina web y redes sociales
    (function(){
      const boton = document.getElementById('redes');
      const campo = document.getElementById('url');
      const etiqueta = document.querySelector('label[for="url"]');

      const modos = {
        pagina:{
          texto:'Pon tus redes si no tienes',
          marcador:'pega aquí tu página',
          tipo:'url',
          etiqueta:'Dirección de tu página'
        },
        redes:{
          texto:'Tengo página web',
          marcador:'pega aquí tu Instagram, Facebook o TikTok',
          tipo:'text',
          etiqueta:'Dirección de tus redes'
        }
      };

      boton.addEventListener('click', function(){
        const enRedes = boton.getAttribute('aria-pressed') === 'true';
        const modo = enRedes ? modos.pagina : modos.redes;

        boton.setAttribute('aria-pressed', String(!enRedes));
        boton.textContent = modo.texto;
        campo.type = modo.tipo;
        campo.placeholder = modo.marcador;
        etiqueta.textContent = modo.etiqueta;
        campo.value = '';
        campo.focus();
      });
    })();
  </script>

</body>
</html>
