<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Unbounded:wght@600;800&display=swap">

  <style>
    /* ---------- tokens ---------- */
    :root{
      --blanco:#FFFFFF;
      --tinta:#0B0005;
      --texto:#1A0710;
      --apagado:#6E5A63;
      --linea:rgba(11,0,5,.14);
      --linea-fuerte:rgba(11,0,5,.28);

      --rosa:#B21A52;
      --vino:#70012B;
      --vino-hondo:#25000E;
      --negro:#000000;

      --fuente-marca:'Unbounded', sans-serif;
      --fuente-texto:'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ---------- base ---------- */
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      background:var(--blanco);
      color:var(--texto);
      font-family:var(--fuente-texto);
      font-size:16px;
      line-height:1.6;
      -webkit-font-smoothing:antialiased;
    }

    .contenedor{
      width:100%;
      max-width:760px;
      margin:0 auto;
      padding:0 32px;
    }
    @media (max-width:640px){
      .contenedor{padding:0 22px;}
    }

    /* ---------- entrada ---------- */
    .entrada{
      min-height:100svh;
      display:flex;
      align-items:center;
      padding:80px 0;
    }
    .bloque{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .saludo{
      font-family:var(--fuente-marca);
      font-weight:600;
      font-size:clamp(1.9rem,5.4vw,3.1rem);
      line-height:1.16;
      letter-spacing:-.03em;
      margin:0;
      color:var(--texto);
      text-wrap:balance;
    }
    /* la palabra lumo es la marca: mismo tipo, peso Black y el degradado rasante */
    .saludo .logo{
      font-family:var(--fuente-marca);
      font-weight:800;
      letter-spacing:-.045em;
      color:var(--vino);
    }
    @supports (-webkit-background-clip:text) or (background-clip:text){
      .saludo .logo{
        background:linear-gradient(90deg,
          var(--rosa) 0%,
          var(--vino) 34%,
          var(--vino-hondo) 72%,
          var(--negro) 100%);
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
      }
    }

    .pregunta{
      font-size:1.12rem;
      color:var(--apagado);
      margin:0 0 14px;
    }

    /* ---------- fila de acciones ---------- */
    .acciones{
      display:flex;
      align-items:stretch;
      gap:14px;
      flex-wrap:wrap;
    }

    .boton{
      font-family:var(--fuente-texto);
      font-size:1rem;
      font-weight:600;
      color:var(--blanco);
      background:var(--vino);
      border:none;
      height:60px;
      padding:0 30px;
      cursor:pointer;
      white-space:nowrap;
      transition:background .18s ease;
    }
    .boton:hover{background:var(--rosa);}
    .boton[aria-pressed="true"]{
      background:var(--blanco);
      color:var(--vino);
      box-shadow:inset 0 0 0 1.5px var(--vino);
    }
    .boton[aria-pressed="true"]:hover{
      background:var(--vino);
      color:var(--blanco);
    }
    .boton:focus-visible{
      outline:2px solid var(--vino);
      outline-offset:3px;
    }

    .caja{
      flex:1;
      min-width:280px;
      display:flex;
      align-items:center;
      height:60px;
      background:var(--blanco);
      border:1.5px solid var(--linea-fuerte);
      transition:border-color .18s ease;
    }
    .caja:focus-within{border-color:var(--vino);}

    .caja input{
      flex:1;
      min-width:0;
      height:100%;
      border:none;
      outline:none;
      background:transparent;
      padding:0 18px;
      font-family:var(--fuente-texto);
      font-size:1rem;
      color:var(--texto);
    }
    .caja input::placeholder{color:var(--apagado);}

    .enviar{
      height:100%;
      width:58px;
      flex:0 0 auto;
      border:none;
      background:transparent;
      color:var(--vino);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:background .18s ease, color .18s ease;
    }
    .enviar:hover{background:var(--vino);color:var(--blanco);}
    .enviar:focus-visible{outline:2px solid var(--vino);outline-offset:-4px;}
    .enviar svg{width:20px;height:20px;display:block;}

    @media (max-width:560px){
      .acciones{flex-direction:column;}
      .boton{width:100%;}
      .caja{width:100%;min-width:0;}
    }

    @media (prefers-reduced-motion:reduce){
      *{transition:none !important;}
    }
  </style>
</head>
<body>

  <main class="entrada">
    <div class="contenedor bloque">

      <h1 class="saludo">
        Bienvenid@ a
        <span class="logo">lumo</span>
      </h1>

      <p class="pregunta">¿Ya tienes página web?</p>

      <div class="acciones">

        <button class="boton" id="redes" type="button" aria-pressed="false">Pon tus redes si no tienes</button>

        <form class="caja" action="#" method="get">
          <label for="url" hidden>Dirección de tu página</label>
          <input id="url" name="url" type="url" inputmode="url" placeholder="pega aquí tu página" autocomplete="url">
          <button class="enviar" type="submit" aria-label="Calificar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true">
              <path d="M4 12h15"/>
              <path d="M13 6l6 6-6 6"/>
            </svg>
          </button>
        </form>

      </div>

    </div>
  </main>

  <script>
    // El boton alterna la caja entre pagina web y redes sociales
    (function(){
      const boton = document.getElementById('redes');
      const campo = document.getElementById('url');
      const etiqueta = document.querySelector('label[for="url"]');

      const modos = {
        pagina: {
          texto:'Pon tus redes si no tienes',
          marcador:'pega aquí tu página',
          tipo:'url',
          etiqueta:'Dirección de tu página'
        },
        redes: {
          texto:'Tengo página web',
          marcador:'pega aquí tu Instagram, Facebook o TikTok',
          tipo:'text',
          etiqueta:'Dirección de tus redes'
        }
      };

      boton.addEventListener('click', function(){
        const enRedes = boton.getAttribute('aria-pressed') === 'true';
        const modo = enRedes ? modos.pagina : modos.redes;

        boton.setAttribute('aria-pressed', String(!enRedes));
        boton.textContent = modo.texto;
        campo.type = modo.tipo;
        campo.placeholder = modo.marcador;
        etiqueta.textContent = modo.etiqueta;
        campo.value = '';
        campo.focus();
      });
    })();
  </script>

</body>
</html>
