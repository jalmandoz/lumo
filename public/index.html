<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumo</title>

  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Satoshi: la misma familia que usa Propiedash -->
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&display=swap">

  <style>
    /* ---------- tokens ---------- */
    :root{
      --blanco:#FFFFFF;
      --negro-texto:#080004;
      --apagado:#6E5A63;
      --linea:rgba(11,0,5,.16);
      --linea-fuerte:rgba(11,0,5,.36);

      --rosa:#B21A52;
      --vino:#70012B;
      --vino-hondo:#25000E;
      --negro:#000000;

      --fuente-marca:'Unbounded', sans-serif;
      --fuente:'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      --titular:clamp(2.9rem,8.8vw,6.2rem);
      --redondo:18px;
      --redondo-chico:13px;

      --curva:cubic-bezier(.16,.84,.26,1);
      --curva-suave:cubic-bezier(.4,0,.2,1);
    }

    /* angulo animable para la luz que recorre el borde */
    @property --angulo{
      syntax:'<angle>';
      initial-value:0deg;
      inherits:false;
    }

    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      background:var(--blanco);
      color:var(--negro-texto);
      font-family:var(--fuente);
      font-size:16px;
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    /* ---------- luz de fondo ---------- */
    .ambiente{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    .mancha{position:absolute;border-radius:50%;filter:blur(90px);opacity:.30;will-change:transform;}
    .m1{
      width:52vw;height:52vw;
      background:radial-gradient(circle at 40% 40%, #B21A52, rgba(178,26,82,0) 70%);
      top:-14vw;left:-10vw;
      animation:vagar-1 26s ease-in-out infinite;
    }
    .m2{
      width:46vw;height:46vw;
      background:radial-gradient(circle at 60% 50%, #70012B, rgba(112,1,43,0) 70%);
      bottom:-18vw;right:-8vw;
      animation:vagar-2 32s ease-in-out infinite;
    }
    .m3{
      width:34vw;height:34vw;
      background:radial-gradient(circle at 50% 50%, #E0648F, rgba(224,100,143,0) 70%);
      top:40%;left:52%;opacity:.22;
      animation:vagar-3 22s ease-in-out infinite;
    }
    @keyframes vagar-1{0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(9vw,7vh,0) scale(1.14);}}
    @keyframes vagar-2{0%,100%{transform:translate3d(0,0,0) scale(1.06);}50%{transform:translate3d(-11vw,-8vh,0) scale(.92);}}
    @keyframes vagar-3{0%,100%{transform:translate3d(0,0,0) scale(.9);}50%{transform:translate3d(-7vw,9vh,0) scale(1.2);}}

    /* el foco que sigue al raton */
    .foco{
      position:fixed;top:0;left:0;
      width:680px;height:680px;margin:-340px 0 0 -340px;
      z-index:1;pointer-events:none;border-radius:50%;
      background:radial-gradient(circle, rgba(178,26,82,.16) 0%, rgba(178,26,82,.06) 38%, rgba(178,26,82,0) 66%);
      opacity:0;transition:opacity .6s var(--curva-suave);will-change:transform;
    }
    .foco.visible{opacity:1;}

    /* ---------- entrada ---------- */
    .entrada{
      position:relative;z-index:2;
      min-height:100svh;
      display:flex;align-items:center;justify-content:center;
      padding:72px 28px;
    }
    .bloque{
      width:100%;max-width:1060px;
      display:flex;flex-direction:column;align-items:center;text-align:center;
    }

    /* ---------- las dos lineas grandes ---------- */
    .titular{
      font-family:var(--fuente);
      font-weight:900;
      font-size:var(--titular);
      line-height:1.02;
      letter-spacing:-.05em;
      margin:0;
      color:var(--negro-texto);
      text-wrap:balance;
    }
    .titular + .titular{margin-top:.06em;}

    .letra{
      display:inline-block;
      opacity:0;
      transform:translateY(30px) scale(.94);
      filter:blur(10px);
      animation:asomar .84s var(--curva) forwards;
    }
    .hueco{display:inline-block;}
    @keyframes asomar{
      to{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
    }

    /* la palabra lumo es la marca */
    .logo{
      font-family:var(--fuente-marca);
      font-weight:800;
      font-size:.86em;
      letter-spacing:-.05em;
      /* el interletrado negativo tambien se aplica detras de la o y le recorta
         el borde: le devolvemos ese aire sin mover nada de sitio */
      padding-right:.07em;
      margin-right:-.07em;
      display:inline-block;
      color:var(--vino);
      opacity:0;
      transform:translateY(30px) scale(.9);
      animation:asomar-marca .98s var(--curva) forwards;
    }
    @keyframes asomar-marca{
      to{opacity:1;transform:translateY(0) scale(1);}
    }
    @supports (-webkit-background-clip:text) or (background-clip:text){
      .logo{
        /* la mitad izquierda de la rampa es el logo tal cual quedo aprobado */
        background-image:linear-gradient(90deg,
          var(--rosa)        0%,
          var(--vino)       17%,
          var(--vino-hondo) 36%,
          var(--negro)      50%,
          var(--rosa)      100%);
        background-size:200% 100%;
        background-position:100% 0;
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
        animation:asomar-marca .98s var(--curva) forwards,
                  rasante 1.6s var(--curva) .55s forwards,
                  respirar 9s ease-in-out 2.4s infinite;
      }
    }
    @keyframes rasante{from{background-position:100% 0;}to{background-position:0% 0;}}
    @keyframes respirar{0%,100%{background-position:0% 0;}50%{background-position:16% 0;}}

    /* ---------- acciones ---------- */
    .acciones{
      display:flex;align-items:stretch;gap:14px;
      width:100%;max-width:760px;
      margin-top:44px;
      opacity:0;transform:translateY(20px);
      animation:asomar-suave .9s var(--curva) 1.25s forwards;
    }
    @keyframes asomar-suave{to{opacity:1;transform:translateY(0);}}

    .boton{
      position:relative;isolation:isolate;overflow:hidden;
      font-family:var(--fuente);
      font-size:1.08rem;
      font-weight:700;
      color:var(--blanco);
      background:var(--vino);
      border:1.5px solid var(--vino);
      border-radius:var(--redondo);
      height:76px;
      padding:0 38px;
      cursor:pointer;
      white-space:nowrap;
      will-change:transform;
      transition:color .32s var(--curva-suave),
                 border-color .32s var(--curva-suave),
                 transform .5s var(--curva);
    }
    .boton::before{
      content:"";position:absolute;inset:0;z-index:-1;
      background:linear-gradient(100deg,var(--rosa),#D94E7E);
      transform:translateY(101%);
      transition:transform .46s var(--curva);
    }
    .boton:hover::before{transform:translateY(0);}
    .boton:focus-visible{outline:2px solid var(--vino);outline-offset:4px;}
    .boton[aria-pressed="true"]{
      background:var(--blanco);
      color:var(--vino);
      border-color:var(--linea-fuerte);
    }
    .boton[aria-pressed="true"]:hover{color:var(--blanco);border-color:var(--rosa);}

    .caja{
      position:relative;flex:1;min-width:0;
      display:flex;align-items:center;gap:8px;
      height:76px;
      padding:0 10px 0 26px;
      background:rgba(255,255,255,.72);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      border:1.5px solid var(--linea);
      border-radius:var(--redondo);
      transition:border-color .32s var(--curva-suave), box-shadow .4s var(--curva-suave);
    }
    .caja:focus-within{
      border-color:rgba(11,0,5,.10);
      box-shadow:0 16px 40px -16px rgba(112,1,43,.45);
    }

    /* la luz da vueltas por el borde mientras estas dentro */
    .caja::before{
      content:"";
      position:absolute;
      inset:-1.5px;
      border-radius:inherit;
      padding:1.6px;
      background:conic-gradient(from var(--angulo),
        rgba(178,26,82,0)   0deg,
        var(--rosa)        50deg,
        var(--vino)       105deg,
        rgba(112,1,43,0)  175deg,
        rgba(178,26,82,0) 360deg);
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
      mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite:exclude;
      opacity:0;
      pointer-events:none;
      transition:opacity .4s var(--curva-suave);
    }
    .caja:focus-within::before{
      opacity:1;
      animation:girar 3.4s linear infinite;
    }
    @keyframes girar{ to{ --angulo:360deg; } }
    .caja input{
      flex:1;min-width:0;height:100%;
      border:none;outline:none;background:transparent;padding:0;
      font-family:var(--fuente);
      font-size:1.1rem;
      font-weight:500;
      color:var(--negro-texto);
    }
    .caja input::placeholder{color:var(--apagado);opacity:.85;}

    .enviar{
      width:58px;height:58px;flex:0 0 auto;
      border:none;border-radius:var(--redondo-chico);
      background:var(--vino);
      color:var(--blanco);
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background .32s var(--curva-suave), transform .4s var(--curva);
    }
    .enviar:hover{background:var(--rosa);transform:scale(1.06);}
    .enviar:focus-visible{outline:2px solid var(--vino);outline-offset:3px;}
    .enviar svg{
      width:23px;height:23px;display:block;
      transition:transform .38s var(--curva);
    }
    .enviar:hover svg{transform:translateX(3px);}

    @media (max-width:680px){
      .acciones{flex-direction:column-reverse;gap:12px;}
      .boton{width:100%;height:68px;}
      .caja{height:68px;}
      .enviar{width:52px;height:52px;}
      .caja{padding-left:22px;}
    }



    /* ================= PANTALLA DE CARGA ================= */
    body.cargando{overflow:hidden;}
    body.cargando .pantalla{visibility:hidden;}
    /* las animaciones de la bienvenida esperan a que termine la carga */
    body.cargando .letra,
    body.cargando .logo,
    body.cargando .acciones{animation-play-state:paused;}

    .cargador{
      position:fixed;inset:0;z-index:50;
      display:flex;align-items:center;justify-content:center;
      padding:32px;
      transition:opacity .75s var(--curva-suave), transform .75s var(--curva);
    }
    .cargador.fuera{
      opacity:0;
      transform:scale(1.04);
      pointer-events:none;
    }

    .cargador-caja{
      display:flex;flex-direction:column;align-items:center;
      width:min(400px,76vw);
      animation:llegar-carga .8s var(--curva) both;
    }
    @keyframes llegar-carga{
      from{opacity:0;transform:translateY(18px) scale(.96);}
      to  {opacity:1;transform:none;}
    }

    /* el logo respirando mientras carga */
    .logo-carga{
      font-family:var(--fuente-marca);
      font-weight:800;
      font-size:clamp(3rem,12vw,5.2rem);
      letter-spacing:-.05em;
      padding-right:.07em;
      line-height:1;
      color:var(--vino);
      margin-bottom:38px;
      will-change:transform;
      animation:latido 3.4s ease-in-out infinite;
    }
    @keyframes latido{
      0%,100%{transform:scale(1);}
      50%    {transform:scale(1.035);}
    }
    @supports (-webkit-background-clip:text) or (background-clip:text){
      .logo-carga{
        background-image:linear-gradient(90deg,
          var(--rosa)        0%,
          var(--vino)       17%,
          var(--vino-hondo) 36%,
          var(--negro)      50%,
          var(--rosa)       72%,
          var(--vino)      100%);
        background-size:240% 100%;
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
        animation:barrer 2.6s linear infinite, latido 3.4s ease-in-out infinite;
      }
    }
    @keyframes barrer{
      from{background-position:100% 0;}
      to  {background-position:-40% 0;}
    }

    /* la barra */
    .barra{
      width:100%;height:9px;
      border-radius:6px;
      background:#F2E8EC;
      overflow:hidden;
      position:relative;
    }
    .relleno{
      display:block;height:100%;width:0;
      border-radius:6px;
      background:linear-gradient(90deg,#D94E7E,var(--rosa),var(--vino),var(--vino-hondo));
      background-size:220% 100%;
      position:relative;
      overflow:hidden;
      box-shadow:0 0 20px -4px rgba(178,26,82,.75);
      animation:llenar 5s linear forwards, correr-color 2.4s linear infinite;
    }
    /* el destello que recorre lo ya cargado */
    .relleno::after{
      content:"";
      position:absolute;top:0;bottom:0;width:45%;
      background:linear-gradient(100deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,.55) 50%,
        rgba(255,255,255,0) 100%);
      animation:destello 1.5s var(--curva-suave) infinite;
    }
    @keyframes llenar{
      0%  {width:0;}
      10% {width:19%;}
      22% {width:28%;}
      38% {width:53%;}
      52% {width:61%;}
      68% {width:79%;}
      84% {width:89%;}
      94% {width:96%;}
      100%{width:100%;}
    }
    @keyframes correr-color{
      from{background-position:0% 0;}
      to  {background-position:-220% 0;}
    }
    @keyframes destello{
      from{left:-50%;}
      to  {left:110%;}
    }

    .firma{
      position:absolute;
      left:50%;bottom:clamp(28px,5vh,52px);
      transform:translateX(-50%);
      display:flex;flex-direction:column;align-items:center;gap:11px;
      animation:asomar-firma .9s var(--curva) 1.1s backwards;
    }
    @keyframes asomar-firma{from{opacity:0;}to{opacity:1;}}
    .firma .por{
      font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:lowercase;
      color:var(--apagado);opacity:.75;
    }
    .firma img{
      display:block;
      width:clamp(118px,17vw,156px);height:auto;
    }

    .cargando-txt{
      margin-top:18px;
      font-size:.95rem;
      font-weight:600;
      color:var(--apagado);
      letter-spacing:.01em;
      align-self:flex-start;
    }
    .puntos i{font-style:normal;opacity:0;animation:puntear 1.4s infinite;}
    .puntos i:nth-child(2){animation-delay:.18s;}
    .puntos i:nth-child(3){animation-delay:.36s;}
    @keyframes puntear{
      0%  {opacity:0;}
      22% {opacity:1;}
      72% {opacity:1;}
      100%{opacity:0;}
    }

    /* ================= ANALISIS PASO A PASO ================= */
    .pantalla{position:relative;z-index:2;}
    .pantalla[hidden]{display:none !important;}

    .entrada.saliendo .bloque{
      animation:salir .5s var(--curva-suave) forwards;
    }
    @keyframes salir{
      to{opacity:0;transform:translateY(-26px) scale(.97);}
    }

    .analisis{
      min-height:100svh;
      display:flex;align-items:center;justify-content:center;
      padding:56px 28px;
    }
    .panel{
      width:100%;max-width:880px;
      display:flex;flex-direction:column;
      animation:entrar-panel .7s var(--curva) both;
    }
    @keyframes entrar-panel{
      from{opacity:0;transform:translateY(34px) scale(.98);}
      to  {opacity:1;transform:none;}
    }

    /* cabecera */
    .panel-top{
      display:flex;align-items:center;justify-content:space-between;
      gap:18px;margin-bottom:30px;
    }
    .objetivo{display:flex;flex-direction:column;gap:2px;min-width:0;}
    .objetivo .et{
      font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
      color:var(--rosa);
    }
    .objetivo .dir{
      font-size:1.12rem;font-weight:700;color:var(--negro-texto);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .volver{
      flex:0 0 auto;
      font-family:var(--fuente);font-size:.92rem;font-weight:600;
      color:var(--apagado);background:none;border:none;cursor:pointer;
      padding:10px 4px;
      transition:color .25s var(--curva-suave);
    }
    .volver:hover{color:var(--vino);}

    /* barra de pasos */
    .rieles{display:flex;align-items:center;gap:0;margin-bottom:34px;}
    .riel{display:flex;align-items:center;flex:1;min-width:0;}
    .riel:last-child{flex:0 0 auto;}
    .punto{
      width:34px;height:34px;flex:0 0 auto;border-radius:11px;
      display:grid;place-items:center;
      background:#F1EBEE;color:#A8919B;
      font-size:.82rem;font-weight:800;
      transition:background .45s var(--curva), color .45s var(--curva), transform .45s var(--curva);
    }
    .riel.hecho .punto{background:#F3D9E3;color:var(--vino);}
    .riel.actual .punto{background:var(--vino);color:var(--blanco);transform:scale(1.14);}
    .punto svg{width:15px;height:15px;}
    .linea{
      height:2px;flex:1;min-width:10px;margin:0 8px;
      background:#EEE6EA;position:relative;overflow:hidden;
    }
    .linea::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(90deg,var(--rosa),var(--vino));
      transform:scaleX(0);transform-origin:left center;
      transition:transform .55s var(--curva);
    }
    .riel.hecho .linea::after{transform:scaleX(1);}

    /* tarjeta del paso */
    .tarjeta{
      border:1.5px solid var(--linea);
      border-radius:22px;
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      padding:34px;
      box-shadow:0 26px 60px -34px rgba(112,1,43,.34);
    }
    @media (max-width:620px){ .tarjeta{padding:24px 20px;} }

    .paso-cab{display:flex;flex-direction:column;gap:6px;margin-bottom:24px;}
    .paso-tit{
      font-size:clamp(1.6rem,4.4vw,2.3rem);
      font-weight:900;letter-spacing:-.03em;line-height:1.08;
      margin:0;color:var(--negro-texto);
    }
    .paso-sub{margin:0;color:var(--apagado);font-size:1rem;font-weight:500;}

    /* escaneo */
    .escaneo{display:flex;flex-direction:column;gap:14px;padding:6px 0 4px;}
    .chequeo{
      display:flex;align-items:center;gap:13px;
      font-size:1rem;font-weight:500;color:var(--apagado);
      opacity:0;transform:translateX(-10px);
      transition:opacity .4s var(--curva), transform .4s var(--curva), color .4s var(--curva);
    }
    .chequeo.viva{opacity:1;transform:none;}
    .chequeo.listo{color:var(--negro-texto);}
    .aro{
      width:22px;height:22px;flex:0 0 auto;border-radius:50%;
      border:2px solid #E4D4DC;border-top-color:var(--rosa);
      animation:girar-aro .7s linear infinite;
    }
    @keyframes girar-aro{to{transform:rotate(360deg);}}
    .chequeo.listo .aro{
      animation:none;border-color:var(--vino);background:var(--vino);
      display:grid;place-items:center;
    }
    .chequeo.listo .aro::after{
      content:"";width:9px;height:5px;
      border-left:2px solid #fff;border-bottom:2px solid #fff;
      transform:rotate(-45deg) translate(1px,-1px);
    }

    /* resultado */
    .resultado{display:none;}
    .resultado.viva{display:block;}

    .marcador{
      display:flex;align-items:center;gap:22px;
      padding-bottom:24px;margin-bottom:22px;
      border-bottom:1px solid var(--linea);
    }
    .aguja{position:relative;width:104px;height:104px;flex:0 0 auto;}
    .aguja svg{transform:rotate(-90deg);display:block;width:100%;height:100%;}
    .aguja .pista{fill:none;stroke:#F1E6EB;stroke-width:9;}
    .aguja .valor{
      fill:none;stroke:url(#degradado-aguja);stroke-width:9;stroke-linecap:round;
      transition:stroke-dashoffset 1.15s var(--curva);
    }
    .aguja .cifra{
      position:absolute;inset:0;display:grid;place-items:center;
      font-size:1.72rem;font-weight:900;letter-spacing:-.04em;
      color:var(--negro-texto);
      font-variant-numeric:tabular-nums;
    }
    .veredicto{display:flex;flex-direction:column;gap:4px;min-width:0;}
    .veredicto .nivel{
      font-size:1.3rem;font-weight:900;letter-spacing:-.025em;color:var(--negro-texto);
    }
    .veredicto .frase{color:var(--apagado);font-size:1rem;font-weight:500;margin:0;}

    .hallazgos{display:flex;flex-direction:column;gap:12px;}
    .hallazgo{
      display:flex;gap:14px;align-items:flex-start;
      padding:16px 18px;border-radius:16px;
      background:#FBF7F9;
      border:1px solid rgba(11,0,5,.07);
      opacity:0;transform:translateY(14px);
    }
    .hallazgo.viva{animation:asomar-suave .6s var(--curva) forwards;}
    .hallazgo.bien{background:#F4FAF6;border-color:rgba(24,106,74,.14);}
    .senal{
      width:26px;height:26px;flex:0 0 auto;border-radius:9px;
      display:grid;place-items:center;
      background:var(--rosa);color:#fff;
    }
    .hallazgo.bien .senal{background:#186A4A;}
    .senal svg{width:14px;height:14px;}
    .hallazgo .cuerpo{display:flex;flex-direction:column;gap:3px;min-width:0;}
    .hallazgo .t{font-weight:800;font-size:1rem;color:var(--negro-texto);letter-spacing:-.01em;}
    .hallazgo .d{font-size:.95rem;color:var(--apagado);font-weight:500;}

    .pie{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      margin-top:26px;padding-top:22px;border-top:1px solid var(--linea);
    }
    .cuenta{font-size:.9rem;font-weight:600;color:var(--apagado);font-variant-numeric:tabular-nums;}

    /* resumen final */
    .total{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:28px;}
    .total .aguja{width:148px;height:148px;}
    .total .aguja .cifra{font-size:2.5rem;}
    .total .nivel{font-size:clamp(1.7rem,4.6vw,2.4rem);font-weight:900;letter-spacing:-.035em;margin-top:8px;}
    .total .frase{color:var(--apagado);max-width:46ch;margin:0;font-weight:500;}
    .lista-arreglos{display:flex;flex-direction:column;gap:10px;}
    .arreglo{
      display:flex;gap:14px;align-items:center;
      padding:15px 18px;border-radius:14px;
      border:1px solid var(--linea);
      opacity:0;transform:translateY(14px);
    }
    .arreglo.viva{animation:asomar-suave .55s var(--curva) forwards;}
    .arreglo .num{
      width:28px;height:28px;flex:0 0 auto;border-radius:9px;
      background:var(--vino);color:#fff;
      display:grid;place-items:center;font-size:.82rem;font-weight:800;
    }
    .arreglo .txt{font-weight:600;font-size:1rem;color:var(--negro-texto);}
    .arreglo .de{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--apagado);white-space:nowrap;}

    .aviso{
      margin-top:22px;font-size:.84rem;color:var(--apagado);
      text-align:center;font-weight:500;
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none !important;transition:none !important;}
      .letra,.logo,.acciones,.hallazgo,.arreglo,.chequeo{opacity:1;transform:none;filter:none;}
      .relleno{animation:llenar .7s linear forwards !important;}
      .logo-carga{background-position:0 0;}
      .logo{background-position:0 0;}
      .foco{display:none;}
    }
  </style>
</head>
<body class="cargando">

  <div class="cargador" id="cargador" role="status" aria-live="polite" aria-label="Cargando">
    <div class="cargador-caja">
      <span class="logo-carga">lumo</span>
      <div class="barra"><span class="relleno"></span></div>
      <span class="cargando-txt">cargando<span class="puntos"><i>.</i><i>.</i><i>.</i></span></span>
    </div>

    <div class="firma">
      <span class="por">powered by</span>
      <img src="at-designs.png" alt="AT Designs" width="3066" height="714">
    </div>
  </div>

  <div class="ambiente" aria-hidden="true">
    <span class="mancha m1"></span>
    <span class="mancha m2"></span>
    <span class="mancha m3"></span>
  </div>
  <div class="foco" id="foco" aria-hidden="true"></div>

  <main class="entrada pantalla" id="pantalla-entrada">
    <div class="bloque">

      <h1 class="titular" data-texto="Bienvenid@ a" data-marca="si">
        Bienvenid@ a <span class="logo">lumo</span>
      </h1>

      <p class="titular" data-texto="¿Ya tienes página web?">¿Ya tienes página web?</p>

      <div class="acciones">
        <button class="boton" id="redes" type="button" aria-pressed="false">Pon tus redes si no tienes</button>

        <form class="caja" id="caja" action="#" method="get" novalidate>
          <label for="url" hidden>Dirección de tu página</label>
          <input id="url" name="url" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="">
          <button class="enviar" type="submit" aria-label="Calificar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 12h15"/><path d="M13 6l6 6-6 6"/>
            </svg>
          </button>
        </form>
      </div>

    </div>
  </main>


  <section class="analisis pantalla" id="pantalla-analisis" hidden>
    <div class="panel">

      <div class="panel-top">
        <div class="objetivo">
          <span class="et" id="et-objetivo">Revisando tu página</span>
          <span class="dir" id="dir-objetivo"></span>
        </div>

      </div>

      <div class="rieles" id="rieles"></div>

      <div class="tarjeta">
        <div class="paso-cab">
          <h2 class="paso-tit" id="paso-tit"></h2>
          <p class="paso-sub" id="paso-sub"></p>
        </div>

        <div class="escaneo" id="escaneo"></div>

        <div class="resultado" id="resultado">
          <div class="marcador">
            <div class="aguja">
              <svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true">
                <defs>
                  <linearGradient id="degradado-aguja" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#B21A52"/>
                    <stop offset="100%" stop-color="#25000E"/>
                  </linearGradient>
                </defs>
                <circle class="pista" cx="52" cy="52" r="45"/>
                <circle class="valor" id="aro-valor" cx="52" cy="52" r="45"
                        stroke-dasharray="282.7" stroke-dashoffset="282.7"/>
              </svg>
              <span class="cifra" id="cifra">0</span>
            </div>
            <div class="veredicto">
              <span class="nivel" id="nivel"></span>
              <p class="frase" id="frase"></p>
            </div>
          </div>
          <div class="hallazgos" id="hallazgos"></div>
        </div>

        <div class="pie">
          <span class="cuenta" id="cuenta"></span>
          <button class="boton" id="siguiente" type="button" style="height:60px;padding:0 32px;">Siguiente</button>
        </div>
      </div>

      <p class="aviso">Ejemplo de demostración. Los puntajes todavía no salen de tu página de verdad.</p>

    </div>
  </section>

  <script>
  (function(){
    const quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const PASO = 0.028;   // segundos entre letra y letra
    let reloj_letras = 0.04;

    /* ---------- las dos lineas entran letra por letra ---------- */
    if(!quieto){
      document.querySelectorAll('.titular').forEach(function(linea){
        const texto = linea.dataset.texto;
        const marca = linea.querySelector('.logo');
        const trozos = document.createDocumentFragment();

        [...texto].forEach(function(caracter){
          const span = document.createElement('span');
          if(caracter === ' '){
            span.className = 'hueco';
            span.innerHTML = '&nbsp;';
          }else{
            span.className = 'letra';
            span.textContent = caracter;
            span.style.animationDelay = reloj_letras.toFixed(3) + 's';
            reloj_letras += PASO;
          }
          trozos.appendChild(span);
        });

        linea.textContent = '';
        linea.appendChild(trozos);

        if(marca){
          linea.appendChild(document.createTextNode(' '));
          linea.appendChild(marca);
          marca.style.animationDelay = reloj_letras.toFixed(3) + 's, ' +
                                       (reloj_letras + 0.5).toFixed(3) + 's, ' +
                                       (reloj_letras + 2.3).toFixed(3) + 's';
          reloj_letras += PASO * 4;
        }
      });
    }

    /* ---------- el foco sigue al raton con retraso ---------- */
    const foco = document.getElementById('foco');
    const raton_fino = window.matchMedia('(pointer:fine)').matches;

    if(!quieto && raton_fino){
      let destinoX = innerWidth/2, destinoY = innerHeight/2;
      let x = destinoX, y = destinoY;

      addEventListener('mousemove', function(e){
        destinoX = e.clientX; destinoY = e.clientY;
        foco.classList.add('visible');
      }, {passive:true});

      (function seguir(){
        x += (destinoX - x) * 0.09;
        y += (destinoY - y) * 0.09;
        foco.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
        requestAnimationFrame(seguir);
      })();
    }

    /* ---------- el boton se imanta al cursor ---------- */
    const boton = document.getElementById('redes');
    if(!quieto && raton_fino){
      boton.addEventListener('mousemove', function(e){
        const c = boton.getBoundingClientRect();
        const dx = (e.clientX - (c.left + c.width/2)) / c.width;
        const dy = (e.clientY - (c.top + c.height/2)) / c.height;
        boton.style.transform = 'translate(' + (dx*9).toFixed(1) + 'px,' + (dy*6).toFixed(1) + 'px)';
      });
      boton.addEventListener('mouseleave', function(){
        boton.style.transform = 'translate(0,0)';
      });
    }

    /* ---------- el marcador se escribe solo ---------- */
    const campo = document.getElementById('url');
    const etiqueta = document.querySelector('label[for="url"]');

    const ejemplos = {
      pagina:['tuinmobiliaria.com','midominio.com.ve','www.tunegocio.com'],
      redes :['instagram.com/tunegocio','facebook.com/tunegocio','tiktok.com/@tunegocio']
    };
    const prefijo = {pagina:'pega aquí tu página, ej. ', redes:'pega aquí tus redes, ej. '};

    let modo = 'pagina';
    let reloj = null;

    function escribir(){
      if(quieto){ campo.placeholder = prefijo[modo].replace(/, ej\. $/,''); return; }
      clearTimeout(reloj);
      let i = 0, j = 0, borrando = false;

      (function paso(){
        const lista = ejemplos[modo];
        const palabra = lista[i % lista.length];
        j = borrando ? j - 1 : j + 1;
        campo.placeholder = prefijo[modo] + palabra.slice(0, j);

        let espera = borrando ? 34 : 62;
        if(!borrando && j === palabra.length){ borrando = true; espera = 1700; }
        else if(borrando && j === 0){ borrando = false; i++; espera = 320; }

        reloj = setTimeout(paso, espera);
      })();
    }
    escribir();

    // la caja sigue viva aunque estes dentro: solo se calla cuando de verdad escribes
    campo.addEventListener('input', function(){
      if(campo.value){
        clearTimeout(reloj);
        campo.placeholder = '';
      }else{
        escribir();
      }
    });

    /* ---------- el boton alterna entre pagina y redes ---------- */
    const textos = {
      pagina:{boton:'Pon tus redes si no tienes', etiqueta:'Dirección de tu página', tipo:'text'},
      redes :{boton:'Tengo página web',           etiqueta:'Dirección de tus redes', tipo:'text'}
    };

    boton.addEventListener('click', function(){
      modo = modo === 'pagina' ? 'redes' : 'pagina';
      const t = textos[modo];

      boton.setAttribute('aria-pressed', String(modo === 'redes'));
      boton.textContent = t.boton;
      etiqueta.textContent = t.etiqueta;
      campo.type = t.tipo;
      campo.value = '';
      escribir();
      campo.focus();
    });


    /* ---------- la carga: cinco segundos y adentro ---------- */
    (function(){
      const cargador = document.getElementById('cargador');
      const espera = quieto ? 700 : 5000;

      setTimeout(function(){
        cargador.classList.add('fuera');
        document.body.classList.remove('cargando');
        cargador.setAttribute('aria-hidden','true');
        setTimeout(function(){ cargador.remove(); }, 800);
      }, espera);
    })();

    /* ================= ANALISIS PASO A PASO ================= */
    let PASOS = [];   // lo llena el motor con datos de verdad

    const NIVELES = [
      {min:80, nivel:'Muy bien',    frase:'Esto ya compite. Lo que queda son detalles finos.'},
      {min:65, nivel:'Va bien',     frase:'La base está. Con dos arreglos das el salto.'},
      {min:50, nivel:'A medias',    frase:'Funciona, pero estás perdiendo gente por el camino.'},
      {min:0,  nivel:'Hay trabajo', frase:'Aquí se te está escapando la mayoría. Empieza por esto.'}
    ];

    const pantallaEntrada = document.getElementById('pantalla-entrada');
    const pantallaAnalisis = document.getElementById('pantalla-analisis');
    const elRieles   = document.getElementById('rieles');
    const elEscaneo  = document.getElementById('escaneo');
    const elResultado= document.getElementById('resultado');
    const elHallazgos= document.getElementById('hallazgos');
    const elTit      = document.getElementById('paso-tit');
    const elSub      = document.getElementById('paso-sub');
    const elCifra    = document.getElementById('cifra');
    const elAro      = document.getElementById('aro-valor');
    const elNivel    = document.getElementById('nivel');
    const elFrase    = document.getElementById('frase');
    const elCuenta   = document.getElementById('cuenta');
    const elSiguiente= document.getElementById('siguiente');
    const elDir      = document.getElementById('dir-objetivo');
    const elEt       = document.getElementById('et-objetivo');
    const elVolver   = document.getElementById('volver');
    const CIRCUNF    = 282.7;

    let actual = 0;
    let relojes = [];

    function limpiarRelojes(){
      relojes.forEach(clearTimeout);
      relojes = [];
    }
    function esperar(ms, fn){
      relojes.push(setTimeout(fn, quieto ? 0 : ms));
    }

    function nivelDe(p){
      return NIVELES.find(function(n){ return p >= n.min; });
    }

    function pintarRieles(){
      elRieles.innerHTML = '';
      const total = PASOS.length + 1;
      for(let i = 0; i < total; i++){
        const riel = document.createElement('div');
        riel.className = 'riel' + (i < actual ? ' hecho' : '') + (i === actual ? ' actual' : '');

        const punto = document.createElement('span');
        punto.className = 'punto';
        if(i < actual){
          punto.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>';
        }else{
          punto.textContent = i === PASOS.length ? '★' : String(i + 1);
        }
        riel.appendChild(punto);

        if(i < total - 1){
          const linea = document.createElement('span');
          linea.className = 'linea';
          riel.appendChild(linea);
        }
        elRieles.appendChild(riel);
      }
    }

    function contarHasta(destino, ms){
      const inicio = performance.now();
      const desde = 0;
      (function tic(ahora){
        const t = Math.min(1, (ahora - inicio) / ms);
        const suave = 1 - Math.pow(1 - t, 3);
        elCifra.textContent = Math.round(desde + (destino - desde) * suave);
        if(t < 1) requestAnimationFrame(tic);
      })(inicio);
    }

    function mostrarPaso(i){
      limpiarRelojes();
      actual = i;
      pintarRieles();

      if(i === PASOS.length){ mostrarTotal(); return; }

      const paso = PASOS[i];
      elTit.textContent = paso.titulo;
      elSub.textContent = paso.sub;
      elCuenta.textContent = 'Paso ' + (i + 1) + ' de ' + PASOS.length;
      elSiguiente.textContent = i === PASOS.length - 1 ? 'Ver el total' : 'Siguiente';
      elSiguiente.disabled = true;
      elSiguiente.style.opacity = '.45';

      elResultado.classList.remove('viva');
      elEscaneo.innerHTML = '';
      elEscaneo.style.display = '';

      paso.chequeos.forEach(function(texto, j){
        const fila = document.createElement('div');
        fila.className = 'chequeo';
        fila.innerHTML = '<span class="aro"></span><span>' + texto + '</span>';
        elEscaneo.appendChild(fila);
        esperar(160 + j * 130, function(){ fila.classList.add('viva'); });
        esperar(620 + j * 460, function(){ fila.classList.add('listo'); });
      });

      const finEscaneo = 620 + paso.chequeos.length * 460;

      esperar(finEscaneo + 260, function(){
        elEscaneo.style.display = 'none';
        elResultado.classList.add('viva');

        const n = nivelDe(paso.puntaje);
        elNivel.textContent = n.nivel;
        elFrase.textContent = n.frase;

        elAro.style.transition = 'none';
        elAro.style.strokeDashoffset = CIRCUNF;
        elAro.getBoundingClientRect();
        elAro.style.transition = '';
        elAro.style.strokeDashoffset = CIRCUNF * (1 - paso.puntaje / 100);
        contarHasta(paso.puntaje, quieto ? 1 : 1100);

        elHallazgos.innerHTML = '';
        paso.hallazgos.forEach(function(h, j){
          const fila = document.createElement('div');
          fila.className = 'hallazgo' + (h.bien ? ' bien' : '');
          fila.style.animationDelay = (0.28 + j * 0.11).toFixed(2) + 's';
          fila.innerHTML =
            '<span class="senal">' + (h.bien
              ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>'
              : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v9"/><path d="M12 18.5v.5"/></svg>'
            ) + '</span>' +
            '<span class="cuerpo"><span class="t"></span><span class="d"></span></span>';
          fila.querySelector('.t').textContent = h.t;
          fila.querySelector('.d').textContent = h.d;
          elHallazgos.appendChild(fila);
          requestAnimationFrame(function(){ fila.classList.add('viva'); });
        });

        elSiguiente.disabled = false;
        elSiguiente.style.opacity = '1';
      });
    }

    function mostrarTotal(){
      const suma = PASOS.reduce(function(a,p){ return a + p.puntaje; }, 0);
      const media = Math.round(suma / PASOS.length);
      const n = nivelDe(media);

      elTit.textContent = 'Tu puntaje';
      elSub.textContent = 'Lo que te falta, en orden de lo que más te cuesta';
      elCuenta.textContent = 'Revisamos ' + PASOS.length + ' cosas';
      elSiguiente.textContent = 'Revisar otra';
      elSiguiente.disabled = false;
      elSiguiente.style.opacity = '1';

      elEscaneo.style.display = 'none';
      elResultado.classList.add('viva');
      elResultado.querySelector('.marcador').className = 'marcador total';
      elNivel.textContent = n.nivel;
      elFrase.textContent = n.frase;

      elAro.style.transition = 'none';
      elAro.style.strokeDashoffset = CIRCUNF;
      elAro.getBoundingClientRect();
      elAro.style.transition = '';
      elAro.style.strokeDashoffset = CIRCUNF * (1 - media / 100);
      contarHasta(media, quieto ? 1 : 1300);

      // solo entran las areas que de verdad tienen algo que arreglar
      const flojos = PASOS
        .map(function(p){ return { p:p, falla:p.hallazgos.find(function(h){ return !h.bien; }) }; })
        .filter(function(x){ return !!x.falla; })
        .sort(function(a,b){ return a.p.puntaje - b.p.puntaje; });

      elHallazgos.className = 'lista-arreglos';
      elHallazgos.innerHTML = '';

      if(!flojos.length){
        const fila = document.createElement('div');
        fila.className = 'arreglo viva';
        fila.innerHTML = '<span class="num">✓</span><span class="txt">No encontramos nada que arreglar</span>';
        elHallazgos.appendChild(fila);
        elSub.textContent = 'Revisamos todo y está en orden';
        return;
      }

      elSub.textContent = 'Lo que te falta, en orden de lo que más te cuesta';
      flojos.forEach(function(x, j){
        const fila = document.createElement('div');
        fila.className = 'arreglo';
        fila.style.animationDelay = (0.3 + j * 0.1).toFixed(2) + 's';
        fila.innerHTML = '<span class="num">' + (j+1) + '</span><span class="txt"></span><span class="de">' + x.p.corto + ' · ' + x.p.puntaje + '</span>';
        fila.querySelector('.txt').textContent = x.falla.t;
        elHallazgos.appendChild(fila);
        requestAnimationFrame(function(){ fila.classList.add('viva'); });
      });
    }

    const elAviso = document.querySelector('.aviso');

    async function arrancarAnalisis(destino){
      elDir.textContent = destino;
      elEt.textContent = 'Revisando';
      elHallazgos.className = 'hallazgos';
      const marc = elResultado.querySelector('.marcador') || elResultado.querySelector('.total');
      if(marc) marc.className = 'marcador';

      pantallaEntrada.classList.add('saliendo');
      esperar(quieto ? 0 : 420, function(){
        pantallaEntrada.hidden = true;
        pantallaEntrada.classList.remove('saliendo');
        pantallaAnalisis.hidden = false;
        window.scrollTo(0,0);
        esperando();
      });

      // el motor trabaja mientras el usuario ve el escaneo
      try{
        const r = await fetch('/api/analizar?destino=' + encodeURIComponent(destino));
        const datos = await r.json();
        if(!r.ok) throw new Error(datos.error || 'No pudimos revisar eso.');

        PASOS = datos.pasos;
        elDir.textContent = datos.destino;
        elEt.textContent = datos.tipo === 'web' ? 'Revisando tu página' : 'Revisando tus redes';
        const segundos = (datos.ms/1000).toFixed(1).replace('.',',');
        let nota = 'Revisado en vivo en ' + segundos + ' segundos. Los puntajes salen de tu ' + (datos.tipo === 'web' ? 'página' : 'perfil') + '.';
        if(datos.motor){
          const extras = [];
          if(datos.motor.velocidad === 'google') extras.push('la velocidad la midió Google');
          if(datos.motor.impresion === 'claude') extras.push('la primera impresión la juzgó Claude');
          if(extras.length) nota += ' Aquí ' + extras.join(' y ') + '.';
        }
        elAviso.textContent = nota;
        mostrarPaso(0);
      }catch(e){
        fallo(e.message);
      }
    }

    // mientras el motor trabaja
    function esperando(){
      limpiarRelojes();
      elRieles.innerHTML = '';
      elTit.textContent = 'Entrando a mirar';
      elSub.textContent = 'Estamos abriendo tu página igual que lo haría un cliente';
      elCuenta.textContent = '';
      elSiguiente.disabled = true;
      elSiguiente.style.opacity = '.45';
      elResultado.classList.remove('viva');
      elEscaneo.style.display = '';
      elEscaneo.innerHTML = '';

      ['Abriendo la dirección','Descargando lo que hay dentro','Midiendo cada cosa'].forEach(function(t,j){
        const fila = document.createElement('div');
        fila.className = 'chequeo';
        fila.innerHTML = '<span class="aro"></span><span>' + t + '</span>';
        elEscaneo.appendChild(fila);
        esperar(140 + j*150, function(){ fila.classList.add('viva'); });
      });
    }

    function fallo(mensaje){
      limpiarRelojes();
      elRieles.innerHTML = '';
      elEscaneo.style.display = 'none';
      elResultado.classList.remove('viva');
      elTit.textContent = 'No pudimos revisarlo';
      elSub.textContent = mensaje;
      elCuenta.textContent = '';
      elAviso.textContent = '';
      elSiguiente.textContent = 'Probar con otra';
      elSiguiente.disabled = false;
      elSiguiente.style.opacity = '1';
      actual = -1;
    }

    document.getElementById('caja').addEventListener('submit', function(e){
      e.preventDefault();
      let valor = campo.value.trim();
      if(!valor){ campo.focus(); return; }
      // nadie escribe https://, se lo quitamos de encima
      valor = valor.replace(/^https?:\/\//i,'').replace(/\/+$/,'');
      clearTimeout(reloj);
      arrancarAnalisis(valor);
    });

    elSiguiente.addEventListener('click', function(){
      if(actual === -1 || actual === PASOS.length){ volverAlInicio(); return; }
      mostrarPaso(actual + 1);
    });

    function volverAlInicio(){
      limpiarRelojes();
      pantallaAnalisis.hidden = true;
      pantallaEntrada.hidden = false;
      campo.value = '';
      escribir();
      window.scrollTo(0,0);
    }
    elVolver.addEventListener('click', volverAlInicio);
  })();

  </script>

</body>
</html>
